name: Build Cordova APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT || true
          yes | $SDKMANAGER --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/my-release-key.keystore

      - name: Create signing properties
        run: |
          printf 'storeFile=%s\n' "$RUNNER_TEMP/my-release-key.keystore" > platforms/android/release-signing.properties
          printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" >> platforms/android/release-signing.properties
          printf 'keyAlias=%s\n' "${{ secrets.KEY_ALIAS }}" >> platforms/android/release-signing.properties
          printf 'keyPassword=%s\n' "${{ secrets.KEY_PASSWORD }}" >> platforms/android/release-signing.properties

      - name: Build Release APK
        run: cordova build android --release

      # Печатаем все APK, которые вообще есть на диске
      - name: Find all APK files
        run: |
          echo "=== Все APK в проекте ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK не найдены"

      # Копируем найденные APK в одну папку
      - name: Collect APKs
        run: |
          mkdir -p $RUNNER_TEMP/apks
          find . -name "*.apk" -type f -exec cp {} $RUNNER_TEMP/apks/ \; 2>/dev/null || true
          echo "=== Содержимое папки для загрузки ==="
          ls -la $RUNNER_TEMP/apks/

      # Загружаем всё, что скопировали
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mayumsyka2-apk
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error
