name: Build Cordova APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT || true
          yes | $SDKMANAGER --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/my-release-key.keystore

      - name: Create signing properties
        run: |
          printf 'storeFile=%s\n' "$RUNNER_TEMP/my-release-key.keystore" > platforms/android/release-signing.properties
          printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" >> platforms/android/release-signing.properties
          printf 'keyAlias=%s\n' "${{ secrets.KEY_ALIAS }}" >> platforms/android/release-signing.properties
          printf 'keyPassword=%s\n' "${{ secrets.KEY_PASSWORD }}" >> platforms/android/release-signing.properties
          echo "=== release-signing.properties ==="
          cat platforms/android/release-signing.properties | sed 's/Password=.*/Password=***/'

      # Вот это ключевое: --verbose и --device, чтобы Cordova честно падала при ошибке
      - name: Build Release APK (verbose)
        run: cordova build android --release --verbose --device

      # Печатаем ВСЮ структуру папки outputs, а не только .apk
      - name: Show build outputs tree
        if: always()
        run: |
          echo "=== platforms/android/app/build/outputs ==="
          find platforms/android/app/build/outputs -type f 2>/dev/null || echo "Папка outputs отсутствует"
          echo ""
          echo "=== Все .apk в проекте ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK не найдены"
          echo ""
          echo "=== Все .aab в проекте ==="
          find . -name "*.aab" -type f 2>/dev/null || echo "AAB не найдены"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/apks
          find . -name "*.apk" -type f -exec cp {} $RUNNER_TEMP/apks/ \; 2>/dev/null || true
          echo "=== Содержимое $RUNNER_TEMP/apks ==="
          ls -la $RUNNER_TEMP/apks/

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayumsyka2-apk
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: warn
