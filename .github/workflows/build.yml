name: Build Signed Cordova APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        run: cordova build android --release -- --packageType=apk || cordova build android --release

      - name: Pick one APK
        run: |
          mkdir -p final
          APK=$(find platforms -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK не собрался"
            exit 1
          fi
          echo "Найден APK: $APK"
          cp "$APK" final/unsigned.apk

      - name: Zipalign
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name zipalign -type f | head -n 1)
          $ZIPALIGN -v 4 final/unsigned.apk final/aligned.apk

      - name: Sign APK with apksigner (v1+v2+v3)
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name apksigner -type f | head -n 1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out final/MayUmshka2.apk \
            final/aligned.apk

      - name: Verify signature (v2 + v3)
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name apksigner -type f | head -n 1)
          $APKSIGNER verify --verbose --print-certs final/MayUmshka2.apk
          echo "=== Проверяем, что v2 и v3 активны ==="
          $APKSIGNER verify --verbose final/MayUmshka2.apk | grep -E "Verified using v[123] scheme"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MayUmshka2-SIGNED
          path: final/MayUmshka2.apk
          if-no-files-found: error
