name: Build Cordova APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      # Восстанавливаем keystore из секрета
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/my-release-key.keystore

      # Создаём release-signing.properties, чтобы Cordova подписала APK
      - name: Create signing properties
        run: |
          cat > platforms/android/release-signing.properties <<EOF
          storeFile=$RUNNER_TEMP/my-release-key.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Собираем release APK
      - name: Build Release APK
        run: cordova build android --release

      # Загружаем подписанный APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mayumsyka2-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
