name: Build Android APK (Chapter 2 Manual Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova_app com.myrunplay.mayumsyka2 MayUmshka2
        rm -rf cordova_app/www/*
        cp -R www/* cordova_app/www/
        cp config.xml cordova_app/config.xml
        cd cordova_app
        cordova platform add android@13.0.0 --no-telemetry
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    # === НОВЫЙ ШАГ: подмена иконки игры на "icon (2).png" из папки www ===
    - name: Set Custom App Icon
      run: |
        ICON_SRC="www/icon (2).png"
        RES_DIR="cordova_app/platforms/android/app/src/main/res"

        for DENSITY in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          DIR="$RES_DIR/mipmap-$DENSITY"
          if [ -d "$DIR" ]; then
            cp "$ICON_SRC" "$DIR/ic_launcher.png"
            cp "$ICON_SRC" "$DIR/ic_launcher_round.png" 2>/dev/null || true
          fi
        done

        if [ -d "$RES_DIR/drawable" ]; then
          cp "$ICON_SRC" "$RES_DIR/drawable/icon.png" 2>/dev/null || true
        fi

    # ГЛАВНЫЙ ШАГ: принудительно ставим versionCode 5 в build.gradle
    - name: Force versionCode=5 in build.gradle
      run: |
        BUILD_GRADLE="cordova_app/platforms/android/app/build.gradle"
        echo "=== build.gradle ДО правки ==="
        grep -n "versionCode" "$BUILD_GRADLE" || true
        sed -i 's/versionCode .*/versionCode 5/' "$BUILD_GRADLE"
        echo "=== build.gradle ПОСЛЕ правки ==="
        grep -n "versionCode" "$BUILD_GRADLE"

    # Правка MainActivity.java — чтобы музыка играла без первого тапа (для WebView)
    - name: Force Android Audio Permissions
      run: |
        MAIN_ACTIVITY=$(find cordova_app/platforms/android/app/src/main/java/ -name "MainActivity.java")
        cat << 'EOF' > $MAIN_ACTIVITY
        package com.myrunplay.mayumsyka2;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import org.apache.cordova.*;

        public class MainActivity extends CordovaActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (customConfig == null) {
                    loadUrl(launchUrl);
                }
                if (appView != null && appView.getEngine() != null) {
                    WebView webView = (WebView) appView.getEngine().getView();
                    WebSettings settings = webView.getSettings();
                    settings.setMediaPlaybackRequiresUserGesture(false);
                    settings.setDomStorageEnabled(true);
                    settings.setJavaScriptEnabled(true);
                }
            }
        }
        EOF

    - name: Fix colors.xml (0x... -> #...)
      run: |
        COLORS_FILE="cordova_app/platforms/android/app/src/main/res/values/colors.xml"
        if [ -f "$COLORS_FILE" ]; then
          echo "=== colors.xml ДО ==="
          cat "$COLORS_FILE"
          sed -i -E 's/(<color[^>]*>)0x([0-9a-fA-F]+)(<\/color>)/\1#\2\3/g' "$COLORS_FILE"
          echo "=== colors.xml ПОСЛЕ ==="
          cat "$COLORS_FILE"
        else
          echo "colors.xml не найден — ок."
        fi

    - name: Build Android Release APK
      run: |
        cd cordova_app
        cordova build android --release --no-telemetry -- --packageType=apk --versionCode=5 --versionName=2.0.0
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Optimize and Sign APK (V2/V3)
      run: |
        keytool -genkey -v -keystore my-release-key.jks -alias game_alias \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass mysecretpassword123 -keypass mysecretpassword123 \
          -dname "CN=MayUmshka2, O=Developer, C=RU"

        ORIGINAL_APK=$(find . -name "*release-unsigned.apk" -o -name "*release.apk" | head -n 1)
        echo "Исходный APK: $ORIGINAL_APK"

        ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)

        $ZIPALIGN -v 4 $ORIGINAL_APK ./aligned.apk
        $APKSIGNER sign \
          --ks my-release-key.jks --ks-key-alias game_alias \
          --ks-pass pass:mysecretpassword123 --key-pass pass:mysecretpassword123 \
          --v2-signing-enabled true --v3-signing-enabled true \
          --out ./MayUmshka2_Chapter2_V5.apk ./aligned.apk

    - name: Verify Final APK
      run: |
        AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -1)
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)

        echo "=== package: name / versionCode / versionName ==="
        $AAPT dump badging MayUmshka2_Chapter2_V5.apk | grep -E "^package"

        echo ""
        echo "=== Иконки ==="
        $AAPT dump badging MayUmshka2_Chapter2_V5.apk | grep -i "application-icon"

        echo ""
        echo "=== Подпись ==="
        $APKSIGNER verify --verbose MayUmshka2_Chapter2_V5.apk

    - name: Upload Finished Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: RuStore-Ready-APK
        path: MayUmshka2_Chapter2_V5.apk
