name: Build Signed Cordova APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # Собираем APK принудительно через двойной дефис (передача в Gradle)
      - name: Build Release APK
        run: cordova build android --release -- --packageType=apk || cordova build android --release

      # Ищем APK и AAB, копируем ВСЁ найденное
      - name: Find and copy
        run: |
          mkdir -p out
          find ${{ github.workspace }}/platforms -name "*.apk" -type f -exec cp {} out/ \; 2>/dev/null || true
          find ${{ github.workspace }}/platforms -name "*.aab" -type f -exec cp {} out/ \; 2>/dev/null || true
          echo "=== Что лежит в out/ ==="
          ls -la out/

      # Если APK есть — подписываем. Если только AAB — пропускаем шаг.
      - name: Sign APK
        run: |
          APK=$(find out -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK не найден, будет загружен только AAB"
            exit 0
          fi
          echo "Подписываем: $APK"
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            "$APK" \
            "${{ secrets.KEY_ALIAS }}"

      - name: Zipalign APK
        run: |
          APK=$(find out -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then exit 0; fi
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name zipalign -type f | head -n 1)
          $ZIPALIGN -v 4 "$APK" out/MayUmshka2-ready.apk

      - name: Upload everything
        uses: actions/upload-artifact@v4
        with:
          name: MayUmshka2-v2.0.0
          path: ${{ github.workspace }}/out/
          if-no-files-found: error
