name: Build Cordova APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Используем Android SDK, который уже есть на раннере
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT || true
          which sdkmanager || true
          ls $ANDROID_SDK_ROOT/cmdline-tools || true

      # Принимаем лицензии через уже установленный sdkmanager
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT || true
          yes | $SDKMANAGER --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/my-release-key.keystore

      - name: Create signing properties
        run: |
          printf 'storeFile=%s\n' "$RUNNER_TEMP/my-release-key.keystore" > platforms/android/release-signing.properties
          printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" >> platforms/android/release-signing.properties
          printf 'keyAlias=%s\n' "${{ secrets.KEY_ALIAS }}" >> platforms/android/release-signing.properties
          printf 'keyPassword=%s\n' "${{ secrets.KEY_PASSWORD }}" >> platforms/android/release-signing.properties

      - name: Build Release APK
        run: cordova build android --release

      - name: List APK files
        run: find platforms/android -name "*.apk" -type f

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mayumsyka2-release-apk
          path: platforms/android/**/*.apk
         
